<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1424">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Anchor Five">
<title>Anchor Five</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><img src="icons/icon.svg" alt="" width="28" height="28"><span>Anchor<b>Five</b></span></div>
  <div id="unitBadge" class="badge">lb</div>
</header>

<main id="view"></main>

<div id="timer" class="timer hidden" role="status" aria-live="polite">
  <div class="timer-bar"><div id="timerFill"></div></div>
  <div class="timer-row">
    <button id="tMinus" class="tbtn" aria-label="Subtract 15 seconds">−15</button>
    <div class="timer-mid"><div id="timerLabel" class="timer-label">Rest</div><div id="timerTime" class="timer-time">1:30</div></div>
    <button id="tPlus" class="tbtn" aria-label="Add 15 seconds">+15</button>
    <button id="tSkip" class="tbtn skip">Done</button>
  </div>
</div>

<nav class="tabs">
  <button data-tab="train" class="on"><svg viewBox="0 0 24 24"><path d="M2 10h2v4H2zM20 10h2v4h-2zM5 7h3v10H5zM16 7h3v10h-3zM8 11h8v2H8z"/></svg>Train</button>
  <button data-tab="history"><svg viewBox="0 0 24 24"><path d="M4 5h16v2H4zM4 11h16v2H4zM4 17h10v2H4z"/></svg>Log</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24"><path d="M3 19h18v2H3zM5 15l4-5 4 3 6-8 1.6 1.2-7.2 9.6-4-3-2.8 3.4z"/></svg>Progress</button>
  <button data-tab="tools"><svg viewBox="0 0 24 24"><path d="M2 11h3v2H2zM19 11h3v2h-3zM6 6h3v12H6zM15 6h3v12h-3zM9 11h6v2H9z"/></svg>Plates</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zm9 5v-2l-2.3-.5a7 7 0 00-.7-1.7l1.3-2-1.4-1.4-2 1.3a7 7 0 00-1.7-.7L13.7 3h-2l-.5 2.3a7 7 0 00-1.7.7l-2-1.3-1.4 1.4 1.3 2a7 7 0 00-.7 1.7L3 11v2l2.3.5c.2.6.4 1.2.7 1.7l-1.3 2 1.4 1.4 2-1.3c.5.3 1.1.5 1.7.7l.5 2.3h2l.5-2.3c.6-.2 1.2-.4 1.7-.7l2 1.3 1.4-1.4-1.3-2c.3-.5.5-1.1.7-1.7z"/></svg>Setup</button>
</nav>

<div id="sheet" class="sheet hidden"><div class="sheet-card" id="sheetCard"></div></div>
<div id="toast" class="toast hidden"></div>

<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
